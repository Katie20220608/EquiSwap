name: Deploy to Render

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token permissions across all jobs
permissions:
  contents: read

jobs:
  unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: EquiSwap/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: EquiSwap/backend

      - name: Lint with ruff
        run: ruff check .
        working-directory: EquiSwap/backend

      - name: Check formatting with ruff
        run: ruff format --check .
        working-directory: EquiSwap/backend

      - name: Run pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90
        working-directory: EquiSwap/backend

      - name: Add backend coverage to Actions summary
        if: always()
        working-directory: EquiSwap/backend
        run: |
          {
            echo '## Backend coverage'
            echo
            if [ ! -f coverage.xml ]; then
              echo 'Coverage report unavailable.'
            else
              python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          line_coverage = float(root.get("line-rate", "0")) * 100
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"| Line coverage |\n| ---: |\n| {line_coverage:.1f}% |\n")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EquiSwap/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: EquiSwap/frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: EquiSwap/frontend

      - name: Type-check and build frontend
        run: npm run build
        working-directory: EquiSwap/frontend

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: EquiSwap/frontend

      - name: Run frontend unit tests with coverage
        run: npm run test:coverage
        working-directory: EquiSwap/frontend

      - name: Add frontend coverage to Actions summary
        if: always()
        working-directory: EquiSwap/frontend
        run: |
          {
            echo '## Frontend coverage'
            echo
            if [ ! -f coverage/coverage-summary.json ]; then
              echo 'Coverage report unavailable.'
            else
              node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from "node:fs";

          const { total } = JSON.parse(readFileSync("coverage/coverage-summary.json", "utf8"));
          const metrics = ["statements", "branches", "functions", "lines"];
          const header = metrics.map((metric) => metric[0].toUpperCase() + metric.slice(1));
          const percentages = metrics.map((metric) => `${total[metric].pct.toFixed(1)}%`);
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `| ${header.join(" | ")} |\n| ${metrics.map(() => "---:").join(" | ")} |\n| ${percentages.join(" | ")} |\n`,
          );
          JS
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: EquiSwap/frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: EquiSwap/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: EquiSwap/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: EquiSwap/frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: EquiSwap/frontend

      - name: Run Playwright tests (mocked API)
        run: npm run test:e2e
        working-directory: EquiSwap/frontend

      - name: Run Playwright tests (real backend)
        run: npm run test:e2e:integration
        working-directory: EquiSwap/frontend

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: EquiSwap/frontend/playwright-report/
          retention-days: 7

  deploy-backend:
    name: Deploy Backend to Render
    needs:
      - unit-tests
      - frontend-tests
      - e2e-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || {
            echo "RENDER_DEPLOY_HOOK_URL is not configured."
            exit 1
          }
          curl --fail-with-body --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for backend health check
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          test -n "$BACKEND_HEALTH_URL" || {
            echo "BACKEND_HEALTH_URL is not configured."
            exit 1
          }
          BACKEND_HEALTH_URL="$(printf '%s' "$BACKEND_HEALTH_URL" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^"//; s/"$//')"
          case "$BACKEND_HEALTH_URL" in
            http://*|https://*) ;;
            *)
              echo "BACKEND_HEALTH_URL must be a complete URL beginning with http:// or https://."
              exit 1
              ;;
          esac
          for attempt in {1..30}; do
            body="$(curl --fail --silent --show-error "$BACKEND_HEALTH_URL" || true)"
            deployed="$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              echo "Backend is healthy and running $GITHUB_SHA."
              exit 0
            fi
            echo "Waiting for backend to run $GITHUB_SHA (attempt $attempt/30, currently '${deployed:-unreachable}')..."
            sleep 10
          done
          echo "Backend did not report version $GITHUB_SHA within 5 minutes."
          exit 1
