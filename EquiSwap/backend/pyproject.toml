[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI's Depends()/Query() default-argument pattern is idiomatic, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# DATABASE_URL env var must be set before importing app.database.
"tests/conftest.py" = ["E402"]
